# Known crawlers (SPEC.md section 7.1).
#
# Each entry: org, name, ua_patterns (Go regexps, matched case-insensitively),
# verify: one of
#   {method: rdns, domains: [...]}   reverse DNS must equal or be a subdomain
#                                    of a listed domain, and forward DNS of
#                                    that name must return the client IP
#   {method: ip_ranges, url: ...}    vendor-published JSON/text list, fetched
#                                    daily and cached on disk
#   {method: ip_ranges, urls: [...]} several such lists; an address in any
#                                    one of them verifies
#   {method: ip_ranges, cidrs: [...]}
#   none                             no official method -> "unverifiable"
#
# ORDER MATTERS: the first matching entry wins, so specific tokens
# (ChatGPT-User, OAI-SearchBot, Applebot-Extended, ...) come before generic
# ones.
#
# Every method below was taken from the vendor's own documentation, checked
# 2026-09-26 or (for entries added later) 2026-09-30, via web search
# restricted to the vendor's domain; direct page fetches were blocked from
# the build sandbox. Aggregators (github.com/ipverse/bot-ip-blocks,
# ondrejnov/bot-ips, ramhee98/ai-crawler-ipranges) were used only to find
# vendor lists, never as a source of addresses; `make crawlers-check`
# compares them with this file. Never add a URL, domain or
# CIDR that is not in official vendor docs; use `verify: none` + TODO
# instead.

# ---------------------------------------------------------------- OpenAI
# Source: https://developers.openai.com/api/docs/bots (formerly
# https://platform.openai.com/docs/bots), which publishes per-bot JSON
# lists at openai.com/{chatgpt-user,searchbot,gptbot}.json.
# ChatGPT-User fetches a page when a ChatGPT user asks it to. OpenAI's
# crawler page says: "Because these actions are initiated by a user,
# robots.txt rules may not apply." (quoted e.g. by Search Engine Journal,
# https://www.searchenginejournal.com/openai-says-robots-txt-may-not-apply-to-chatgpts-fetch-bot/585864/;
# the primary page was unreachable from the build sandbox on 2026-09-27.
# TODO: re-read https://developers.openai.com/api/docs/bots to confirm.)
- org: OpenAI
  name: ChatGPT-User
  ua_patterns: ['\bChatGPT-User\b']
  verify: {method: ip_ranges, url: "https://openai.com/chatgpt-user.json"}
  user_triggered: true
  robots_exempt: true

- org: OpenAI
  name: OAI-SearchBot
  ua_patterns: ['\bOAI-SearchBot\b']
  verify: {method: ip_ranges, url: "https://openai.com/searchbot.json"}

- org: OpenAI
  name: GPTBot
  ua_patterns: ['\bGPTBot\b']
  verify: {method: ip_ranges, url: "https://openai.com/gptbot.json"}

# ------------------------------------------------------------- Anthropic
# Source: https://support.claude.com/en/articles/8896518-does-anthropic-crawl-data-from-the-web-and-how-can-site-owners-block-the-crawler
# (checked 2026-09-27): "If a crawler has a source IP address on this list,
# it indicates that the crawler is coming from Anthropic", linking
# https://claude.com/crawling/bots.json (Google-style {"prefixes":[{"ipv4Prefix":...}]}).
# One list covers all three bots. The article also states all three honour
# robots.txt. (Earlier builds had verify: none here because the article did
# not yet publish a list.)
# Claude-User fetches on a user's request, but Anthropic states it honours
# robots.txt, so it is NOT robots_exempt: its /lawn/ hits are violations.
- org: Anthropic
  name: Claude-User
  ua_patterns: ['\bClaude-User\b']
  verify: {method: ip_ranges, url: "https://claude.com/crawling/bots.json"}
  user_triggered: true
- org: Anthropic
  name: Claude-SearchBot
  ua_patterns: ['\bClaude-SearchBot\b']
  verify: {method: ip_ranges, url: "https://claude.com/crawling/bots.json"}
- org: Anthropic
  name: ClaudeBot
  ua_patterns: ['\bClaudeBot\b']
  verify: {method: ip_ranges, url: "https://claude.com/crawling/bots.json"}
# ----------------------------------------------------------- Common Crawl
# Source: https://commoncrawl.org/ccbot
# Common Crawl documents dedicated ranges with reverse DNS under
# crawl.commoncrawl.org for IPv4 only (no rDNS over IPv6), and publishes all
# v4+v6 ranges as JSON. The JSON list is used because it covers IPv6.
- org: Common Crawl
  name: CCBot
  ua_patterns: ['\bCCBot\b']
  verify: {method: ip_ranges, url: "https://index.commoncrawl.org/ccbot.json"}

# ------------------------------------------------------------ Perplexity
# Source: https://docs.perplexity.ai/docs/resources/perplexity-crawlers
# Perplexity-User fetches when a person asks Perplexity something; unlike
# PerplexityBot it is not bound by robots.txt the same way (Perplexity
# crawler docs above; "Agents or Bots?" https://www.perplexity.ai/hub/blog/agents-or-bots-making-sense-of-ai-on-the-open-web).
- org: Perplexity
  name: Perplexity-User
  ua_patterns: ['\bPerplexity-User\b']
  verify: {method: ip_ranges, url: "https://www.perplexity.com/perplexity-user.json"}
  user_triggered: true
  robots_exempt: true

- org: Perplexity
  name: PerplexityBot
  ua_patterns: ['\bPerplexityBot\b']
  verify: {method: ip_ranges, url: "https://www.perplexity.com/perplexitybot.json"}

# -------------------------------------------------------------- Parallel
# Source: https://docs.parallel.ai/resources/crawler ("Crawler - Parallel
# Docs"): ShapBot discovers and indexes sites for Parallel's web APIs; its
# user agent is "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko);
# compatible; ShapBot/0.1.0", and "for the complete list of ShapBot IPs, see
# shapbot.json" at docs.parallel.ai/resources/shapbot.json. The page asks
# sites to allow ShapBot in robots.txt, i.e. it follows robots.txt.
# The list was confirmed by the operator on 2026-09-30 (fetched directly;
# docs.parallel.ai is blocked from the build sandbox): Google-style
# {"prefixes":[{"ipv4Prefix":"x.x.x.x/32"}]}, IPv4 only.
- org: Parallel Web Systems
  name: ShapBot
  ua_patterns: ['\bShapBot\b']
  verify: {method: ip_ranges, url: "https://docs.parallel.ai/resources/shapbot.json"}

# ------------------------------------------------------------- ByteDance
# No official ByteDance documentation for Bytespider could be found; only
# third-party directories describe it. Nothing from those is used here.
- org: ByteDance
  name: Bytespider
  ua_patterns: ['\bBytespider\b']
  # TODO: no official verification method found (searched for vendor docs, 2026-09-26)
  verify: {method: none}

# ---------------------------------------------------------------- Amazon
# Source: https://developer.amazon.com/amazonbot
# Reverse DNS must be a subdomain of crawl.amazonbot.amazon, then forward
# confirm. (Amazon also publishes IP lists on developer.amazon.com; rDNS is
# the documented verification procedure, so it is used.)
- org: Amazon
  name: Amazonbot
  ua_patterns: ['\bAmazonbot\b']
  verify: {method: rdns, domains: [crawl.amazonbot.amazon]}

# ----------------------------------------------------------------- Apple
# Source: https://support.apple.com/en-us/119829 ("About Applebot")
# Applebot-Extended is NOT a fetcher: Apple says it "does not crawl
# webpages" and is only a robots.txt token controlling how data crawled by
# Applebot is used. Real Apple fetches always carry the Applebot UA. The entry
# is kept (and listed first so it wins over the generic Applebot pattern) so
# that any client literally sending "Applebot-Extended" is recorded as
# claiming Apple, but it cannot be verified: `none`, i.e. unverifiable.
- org: Apple
  name: Applebot-Extended
  ua_patterns: ['\bApplebot-Extended\b']
  # NOTE: robots.txt product token only; Apple documents no fetcher with this UA.
  verify: {method: none}

# Apple documents reverse DNS in *.applebot.apple.com (used here) and,
# alternatively, a JSON CIDR list linked from the same page.
- org: Apple
  name: Applebot
  ua_patterns: ['\bApplebot\b']
  verify: {method: rdns, domains: [applebot.apple.com]}

# ---------------------------------------------------------------- Google
# Google's special-case crawlers and user-triggered fetchers each have a
# published list under developers.google.com/static/crawling/ipranges/
# (special-crawlers, user-triggered-fetchers, user-triggered-fetchers-google,
# user-triggered-agents). Sources:
# https://developers.google.com/crawling/docs/crawlers-fetchers/google-special-case-crawlers
# https://developers.google.com/crawling/docs/crawlers-fetchers/google-user-triggered-fetchers
# https://developers.google.com/crawling/docs/changelog (Google-Agent)
# Google's pages were blocked from the build sandbox (2026-09-30), so the
# per-family tables of user agents could not be read in full. Both entries
# are therefore verified against the union of all of Google's crawler lists:
# an address in any of them is Google's crawling infrastructure, whichever
# family a token belongs to. Reverse DNS is not used: googleusercontent.com
# also covers customers' Google Cloud machines (see Googlebot below).
#
# Special-case crawlers "may ignore robots.txt rules" (they work under an
# agreement with the site, e.g. AdsBot with the advertiser's permission);
# they are not user-triggered, so they stay ordinary entries.
- org: Google
  name: Google special-case crawlers
  ua_patterns: ['\bAdsBot-Google\b', '\bMediapartners-Google\b', '\bAPIs-Google\b']
  verify:
    method: ip_ranges
    urls:
      - "https://developers.google.com/static/crawling/ipranges/special-crawlers.json"
      - "https://developers.google.com/static/crawling/ipranges/user-triggered-fetchers.json"
      - "https://developers.google.com/static/crawling/ipranges/user-triggered-fetchers-google.json"
      - "https://developers.google.com/static/crawling/ipranges/user-triggered-agents.json"
      - "https://developers.google.com/static/crawling/ipranges/common-crawlers.json"

# User-triggered fetchers: "Because the fetch was requested by a user, these
# fetchers generally ignore robots.txt rules" (user-triggered fetchers page).
- org: Google
  name: Google user-triggered fetchers
  # TODO: catalogues also list GoogleAgent-Mariner (Project Mariner) and a
  # "Google Publisher Center" fetcher; add their tokens once they are read
  # on the user-triggered fetchers page itself (checked via search only,
  # 2026-09-30). Chrome-Lighthouse is left out on purpose: Lighthouse also
  # runs in anyone's Chrome DevTools and CI, so a Google-list check would
  # brand those users as spoofers.
  ua_patterns: ['\bFeedFetcher-Google\b', '\bGoogle-Read-Aloud\b', '\bGoogle-Site-Verification\b',
    '\bGoogle-Pinpoint\b', '\bGoogle-CWS\b', '\bGoogle-NotebookLM\b', '\bGoogle-Agent\b']
  verify:
    method: ip_ranges
    urls:
      - "https://developers.google.com/static/crawling/ipranges/special-crawlers.json"
      - "https://developers.google.com/static/crawling/ipranges/user-triggered-fetchers.json"
      - "https://developers.google.com/static/crawling/ipranges/user-triggered-fetchers-google.json"
      - "https://developers.google.com/static/crawling/ipranges/user-triggered-agents.json"
      - "https://developers.google.com/static/crawling/ipranges/common-crawlers.json"
  user_triggered: true
  robots_exempt: true

# Google-Extended is a robots.txt product token, not an HTTP user agent:
# Google fetches with its normal crawler UAs (Googlebot etc.) and the token
# only controls use for Gemini/Vertex AI. Source:
# https://developers.google.com/crawling/docs/crawlers-fetchers/google-common-crawlers
# Kept for the same reason as Applebot-Extended.
- org: Google
  name: Google-Extended
  ua_patterns: ['\bGoogle-Extended\b']
  # NOTE: robots.txt product token only; Google documents no fetcher with this UA.
  verify: {method: none}

# Source: https://developers.google.com/crawling/docs/crawlers-fetchers/google-common-crawlers
# "Google's common crawlers generally crawl from the IP ranges published in
# the common-crawlers.json object, and the reverse DNS mask of their hostname
# matches crawl-***-***-***-***.googlebot.com or
# geo-crawl-***-***-***-***.geo.googlebot.com" - the same check as Googlebot
# below (see there for why only googlebot.com). GoogleOther also matches its
# -Image and -Video variants. DuplexWeb-Google is not added: Google shut
# Duplex on the web down.
- org: Google
  name: Google common crawlers
  ua_patterns: ['\bGoogleOther\b', '\bStorebot-Google\b', '\bGoogle-InspectionTool\b']
  verify: {method: rdns, domains: [googlebot.com]}

# Source: https://developers.google.com/crawling/docs/crawlers-fetchers/verify-google-requests
# Google's verification page accepts googlebot.com, google.com and
# googleusercontent.com, but per the common-crawlers page, Googlebot itself
# resolves to crawl-*.googlebot.com or geo-crawl-*.geo.googlebot.com.
# google.com is used by special-case crawlers (rate-limited-proxy-*) and
# googleusercontent.com by user-triggered fetchers, *including user-owned
# ones* (*.gae.googleusercontent.com), so accepting those for a "Googlebot"
# UA would let anyone on Google Cloud pass. Only googlebot.com is accepted.
# Alternative (not used): the published list
# https://developers.google.com/static/crawling/ipranges/common-crawlers.json
- org: Google
  name: Googlebot
  ua_patterns: ['\bGooglebot\b']
  verify: {method: rdns, domains: [googlebot.com]}

# ------------------------------------------------------------- Microsoft
# Source: https://www.bing.com/webmasters/help/how-to-verify-bingbot-3905dc26
# Reverse DNS must end in search.msn.com, then forward confirm. (Bing now
# also serves www.bing.com/toolbox/bingbot.json; reverse DNS is kept.)
# The other crawlers: "Microsoft has four bots that may crawl your site:
# Bingbot, Adidxbot, MSNbot, or BingPreview", all verified the same way
# (https://about.ads.microsoft.com/en-gb/blog/post/may-2014/tips-to-control-traffic-spikes-caused-by-bots-crawling-your-web-site;
# the crawler list is at
# https://www.bing.com/webmasters/help/which-crawlers-does-bing-use-8c184ec0).
- org: Microsoft
  name: Bingbot
  ua_patterns: ['\bbingbot\b', '\badidxbot\b', '\bmsnbot\b', '\bBingPreview\b']
  verify: {method: rdns, domains: [search.msn.com]}

# MicrosoftPreview fetches link previews for Teams, Outlook and other
# Microsoft apps when someone shares a URL (so user-triggered).
- org: Microsoft
  name: MicrosoftPreview
  ua_patterns: ['\bMicrosoftPreview\b']
  # TODO: only third-party pages describe it (they point at Bing's Verify
  # Bingbot tool); no Microsoft page confirming its reverse DNS or an IP list
  # was found (searched 2026-09-30).
  verify: {method: none}

# ------------------------------------------------------------ DuckDuckGo
# Sources: https://duckduckgo.com/duckduckgo-help-pages/results/duckduckbot
# and https://duckduckgo.com/duckduckgo-help-pages/results/duckassistbot
# DuckDuckBot "respects WWW::RobotRules and originates from" the addresses
# in duckduckbot.json; DuckAssistBot from those in duckassistbot.json.
- org: DuckDuckGo
  name: DuckAssistBot
  ua_patterns: ['\bDuckAssistBot\b']
  verify: {method: ip_ranges, url: "https://duckduckgo.com/duckassistbot.json"}

- org: DuckDuckGo
  name: DuckDuckBot
  ua_patterns: ['\bDuckDuckBot\b']
  verify: {method: ip_ranges, url: "https://duckduckgo.com/duckduckbot.json"}

# --------------------------------------------------------------- Mistral
# Source: https://docs.mistral.ai/robots ("Mistral crawlers"). MistralAI-User
# fetches pages "for user actions" and is "not used for crawling the web in
# any automatic fashion"; MistralAI-Index crawls for Mistral's search index.
# The page publishes "MistralAI-User IP addresses" and "MistralAI-Index IP
# addresses". The list URLs below were found via the ai-crawler-ipranges
# registry (github.com/ramhee98/ai-crawler-ipranges) because docs.mistral.ai
# was blocked from the build sandbox; the operator fetched both from
# mistral.ai on 2026-09-30 (Google-style ipv4Prefix lists). The page does not
# say robots.txt may not apply, so MistralAI-User is user-triggered but not
# exempt.
- org: Mistral AI
  name: MistralAI-User
  ua_patterns: ['\bMistralAI-User\b']
  verify: {method: ip_ranges, url: "https://mistral.ai/mistralai-user-ips.json"}
  user_triggered: true

- org: Mistral AI
  name: MistralAI-Index
  ua_patterns: ['\bMistralAI-Index\b']
  verify: {method: ip_ranges, url: "https://mistral.ai/mistralai-index-ips.json"}

# ---------------------------------------------------------------- Seznam
# Source: https://napoveda.seznam.cz/en/full-text-search/seznambot-crawler/
# Seznam says every SeznamBot address has a reverse DNS record, but not
# which domain it ends in, so rDNS is not used (a wrong guess would call
# the real SeznamBot a spoofer). Seznam publishes the list below on its own
# search domain (same schema as Google's); the operator fetched it on
# 2026-09-30 (ipv4Prefix /32s).
- org: Seznam.cz
  name: SeznamBot
  ua_patterns: ['\bSeznamBot\b']
  verify: {method: ip_ranges, url: "https://search.seznam.cz/ipranges/seznambot.json"}

# ------------------------------------------------------------------ Kagi
# Source: https://kagi.com/bot. Kagibot's four addresses are listed with
# host names under kagibot.org (amd., donna., knet., ogi.kagibot.org), and it
# respects robots.txt. Forward-confirmed reverse DNS under kagibot.org keeps
# working if the addresses change.
- org: Kagi
  name: Kagibot
  ua_patterns: ['\bKagibot\b']
  verify: {method: rdns, domains: [kagibot.org]}

# ---------------------------------------------------------------- Ahrefs
# Sources: https://ahrefs.com/robot and
# https://help.ahrefs.com/en/articles/78658-what-is-the-list-of-your-ip-ranges
# "The reverse DNS suffix of the IPs hostname is always ahrefs.com or
# ahrefs.net." Both bots "strictly respect robots.txt"; AhrefsSiteAudit
# ignores it only on sites whose verified owners allow that.
- org: Ahrefs
  name: AhrefsSiteAudit
  ua_patterns: ['\bAhrefsSiteAudit\b']
  verify: {method: rdns, domains: [ahrefs.com, ahrefs.net]}

- org: Ahrefs
  name: AhrefsBot
  ua_patterns: ['\bAhrefsBot\b']
  verify: {method: rdns, domains: [ahrefs.com, ahrefs.net]}

# ------------------------------------------------------------ SE Ranking
# Sources: https://help.seranking.com/hc/en-us/articles/16335355751196-Verifying-SE-Ranking-Crawler-FAQ
# (SEBot-WA: "every crawler host resolves under *.sr-srv.net", a domain
# "owned and exclusively used by SE Ranking") and
# https://help.seranking.com/hc/en-us/articles/23020353159964-SERankingBacklinksBot-Crawler
# (reverse DNS "should show you one of the sub-domains of *.seranking.com";
# it "always respects the rules specified in robots.txt").
- org: SE Ranking
  name: SEBot-WA
  ua_patterns: ['\bSEBot-WA\b']
  verify: {method: rdns, domains: [sr-srv.net]}

- org: SE Ranking
  name: SERankingBacklinksBot
  ua_patterns: ['\bSERankingBacklinksBot\b']
  verify: {method: rdns, domains: [seranking.com]}

# ------------------------------------------------------------------ Meta
# Source: https://developers.facebook.com/documentation/sharing/webmasters/web-crawlers
# The page recommends allow-listing by UA or by "the IP addresses used by
# the crawler" but gives no URL list or reverse-DNS scheme that could be
# confirmed from it (Meta's other docs derive IPs from routing-registry
# entries for AS32934, which is not a published crawler list).
- org: Meta
  name: meta-externalfetcher
  ua_patterns: ['\bmeta-externalfetcher\b']
  # TODO: no official verification method found (checked the page above, 2026-09-26)
  verify: {method: none}

- org: Meta
  name: meta-externalagent
  ua_patterns: ['\bmeta-externalagent\b']
  # TODO: no official verification method found (checked the page above, 2026-09-26)
  verify: {method: none}

# Same page: facebookexternalhit fetches a link when it is shared on Meta's
# apps (user-triggered) and "might bypass robots.txt when performing
# security or integrity checks". The user_triggered/robots_exempt flags only
# take effect once verified, so they are left off until there is a method.
# FacebookBot: https://developers.facebook.com/docs/sharing/bot/
- org: Meta
  name: facebookexternalhit
  ua_patterns: ['\bfacebookexternalhit\b']
  # TODO: no official verification method found (checked 2026-09-30)
  verify: {method: none}

- org: Meta
  name: FacebookBot
  ua_patterns: ['\bFacebookBot\b']
  # TODO: no official verification method found (checked 2026-09-30)
  verify: {method: none}

# ---------------------------------------------------------------- Yandex
# Source: https://yandex.com/support/webmaster/en/robot-workings/check-yandex-robots
# "All Yandex robots have names ending in yandex.ru, yandex.net or
# yandex.com", then forward confirm. Yandex does not publish its addresses
# ("their list is not disclosed"). The tokens are Yandex's robots as listed
# in its help pages and the catalogues; they are spelled out rather than
# matched as Yandex* so Yandex's own apps and browser are never included.
- org: Yandex
  name: YandexBot
  ua_patterns: ['\bYandex(?:Bot|MobileBot|AccessibilityBot|AdditionalBot|Images|Media|Metrika|News|Video|Favicons|Market)\b']
  verify: {method: rdns, domains: [yandex.ru, yandex.net, yandex.com]}
