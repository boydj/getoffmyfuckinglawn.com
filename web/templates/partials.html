{{define "style"}}<style>
:root{--bg:#fbfaf5;--fg:#1d1d1a;--mute:#66655e;--line:#dddacf;--code:#efece2;--acc:#2d6a2d;--ok:#1d6b3b;--bad:#a3261d;--warn:#855700;--neu:#58585a;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#131411;--fg:#e7e5dd;--mute:#9b998f;--line:#33342e;--code:#1f201c;--acc:#8fcc7b;--ok:#72d39c;--bad:#ff8d82;--warn:#e7b65c;--neu:#b0b0b0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main,footer{max-width:74rem;margin:0 auto;padding:1rem}
footer{border-top:1px solid var(--line);margin-top:2rem}
a{color:var(--acc)}
h1{font-size:1.9rem;margin:.4rem 0}
h2{margin-top:2rem;padding-bottom:.2rem;border-bottom:1px solid var(--line);font-size:1.3rem}
.lede,.note,small{color:var(--mute)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
th,td{padding:.3rem .5rem;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
td{white-space:nowrap}
th{vertical-align:bottom}
th[rowspan],tr:first-child>th:first-child,td:first-child,.l{text-align:left}
th[rowspan]:not(:first-child):not(.l){text-align:right}
th.g{text-align:center;border-bottom:none;padding-bottom:0}
td.w{white-space:normal;overflow-wrap:break-word;min-width:12rem}
code.ua{display:block;margin-top:.3rem;font-size:.75rem;color:var(--mute)}
small.obs{display:block}
code,pre{font:.85rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
pre{background:var(--code);padding:.75rem;overflow-x:auto}
.b{display:inline-block;padding:0 .4em;border:1px solid;border-radius:.3em;font-size:.75rem;margin:0 .2em .1em 0;white-space:nowrap}
.b-verified{color:var(--ok)}.b-spoofed{color:var(--bad)}.b-unverifiable{color:var(--warn)}.b-anonymous{color:var(--neu)}.b-user_triggered{color:var(--acc)}
.stats{display:flex;flex-wrap:wrap;gap:.75rem;padding:0;list-style:none}
.stats li{border:1px solid var(--line);padding:.5rem .8rem;min-width:10rem}
.stats b{display:block;font-size:1.4rem}
dt{font-weight:600}dd{margin:0 0 .5rem 1rem}
svg{color:var(--acc)}
.bait{display:none}
.prose{max-width:44rem;font-size:1.05rem;line-height:1.6}
.cta{display:inline-block;margin:.5rem 0;padding:.45rem .8rem;border:2px solid var(--acc);text-decoration:none;font-weight:600}
</style>{{end}}
{{define "footer"}}<footer>
<h2 id="rules">The rules, exactly as served</h2>
<p class="note">This is the robots.txt in effect at <code>/robots.txt</code>. Every request counted on the Wall of Shame is a fetch of a path it disallows.</p>
<pre>{{.}}</pre>
<p><a href="/#methodology">Methodology</a> · <a href="/shame/">Wall of Shame</a> · <a href="/shame/feed.json">feed.json</a> · <a href="/shame/blocklist.txt">blocklist.txt</a></p>
</footer>{{end}}
